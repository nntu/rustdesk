# ------------------------------------------------------------------------------
# CoTURN Production Configuration for RustDesk WebRTC STUN/TURN
# ------------------------------------------------------------------------------

# Listening Port (Plain UDP/TCP for STUN & TURN)
listening-port=3478

# Relay UDP Port Range (RFC 5766)
min-port=49152
max-port=49200

# Realm & Server Identity
realm=rd.ngoctuct.io.vn
server-name=rd.ngoctuct.io.vn

# Authentication (Shared Secret for WebRTC & REST API)
fingerprint
use-auth-secret
static-auth-secret=super_secret_coturn_auth_key

# Security & Traffic Rules
no-multicast-peers

# Disable TLS listener as no certs are configured
no-tls

# Logging
log-file=stdout
